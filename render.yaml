# Suitor — Render Blueprint
# Deploy via the Render dashboard (Blueprints > New Blueprint Instance)
# pointing at the repo containing this file, or via the "Deploy to Render"
# button. Secrets (JWT_SECRET, PAYPAL_CLIENT_ID, PAYPAL_SECRET) are declared
# with `sync: false` so they are set only in the Render dashboard — no secret
# values live in this repo. The database connection string is wired
# automatically from the managed Postgres instance below.
# PayPal runs in sandbox mode only on this demo; no real money moves.

services:
  - type: web
    name: suitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: TOKEN_COST_PER_MESSAGE
        value: 10
      - key: WELCOME_TOKENS
        value: 25
      - key: DATABASE_URL
        fromDatabase:
          name: suitor-db
          property: connectionString
      # Secrets — set these in the Render dashboard (never commit values).
      - key: JWT_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false

databases:
  - name: suitor-db
    databaseName: suitor
    plan: free
    postgresMajorVersion: "16"
